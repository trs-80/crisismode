# SPDX-License-Identifier: Apache-2.0
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The supported LTS lines. Node 18 reached EOL 2025-04-30 and Node 20
        # on 2026-04-30, so neither is tested or claimed in package.json#engines.
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      # oxlint is the pre-commit gate, not a CI gate — ESLint below is a
      # superset. It runs here (~0.5s) only so a broken or drifted
      # .oxlintrc.json fails a PR instead of silently breaking every
      # contributor's commit hook.
      - name: Lint (oxlint — pre-commit hook parity)
        run: pnpm lint:fast

      - name: Lint
        run: pnpm lint

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 22
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  cli-smoke:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: CLI smoke tests
        run: pnpm test:cli

  # The spoke ships as a container, but nothing built it — so the image was
  # broken on main for an unknown period (it copied neither pnpm-workspace.yaml
  # nor packages/, making `workspace:*` unresolvable) with no signal. Building
  # it here is the guard; the run steps assert the image is usable, not merely
  # that the build exited 0.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build spoke image
        run: docker build -t crisismode:ci .

      - name: Workspace dependency resolves at runtime
        run: |
          docker run --rm --entrypoint node crisismode:ci -e \
            "import('@crisismode/agent-sdk').then((m) => console.log('agent-sdk resolved, exports:', Object.keys(m).length)).catch((err) => { console.error('agent-sdk failed to resolve:', err.message); process.exit(1); })"

      - name: CLI runs inside the image
        run: docker run --rm --entrypoint node crisismode:ci dist/cli/index.js --version

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
