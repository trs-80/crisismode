# SPDX-License-Identifier: Apache-2.0
name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Least privilege by default; only the job that publishes the release is
# granted write. The build jobs handle signing secrets, so there is no reason
# for them to also hold a token that can push to the repository.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

  build-linux:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Linux binaries
        run: |
          TARGET=bun-linux-x64 bash scripts/build-binary.sh
          TARGET=bun-linux-arm64 bash scripts/build-binary.sh

      - name: Generate checksums
        run: |
          cd dist
          for bin in crisismode-linux-x64 crisismode-linux-arm64; do
            sha256sum "$bin" > "${bin}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-linux
          path: |
            dist/crisismode-linux-x64
            dist/crisismode-linux-x64.sha256
            dist/crisismode-linux-arm64
            dist/crisismode-linux-arm64.sha256

  build-darwin:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build Darwin binaries
        run: |
          TARGET=bun-darwin-x64 bash scripts/build-binary.sh
          TARGET=bun-darwin-arm64 bash scripts/build-binary.sh

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Sign binaries
        run: |
          IDENTITY="Developer ID Application: Aaron Johnson (CF4U8Z52PH)"
          for bin in dist/crisismode-darwin-x64 dist/crisismode-darwin-arm64; do
            codesign --force --options runtime --timestamp --sign "$IDENTITY" "$bin"
            echo "Signed: $bin"
            codesign --verify --verbose "$bin"
          done

      - name: Notarize binaries
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        run: |
          for bin in dist/crisismode-darwin-x64 dist/crisismode-darwin-arm64; do
            BASENAME=$(basename "$bin")
            ZIP_PATH="$RUNNER_TEMP/${BASENAME}.zip"

            ditto -c -k --keepParent "$bin" "$ZIP_PATH"

            xcrun notarytool submit "$ZIP_PATH" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_ID_PASSWORD" \
              --wait

            echo "Notarized: $BASENAME"
          done

      - name: Generate checksums
        run: |
          cd dist
          for bin in crisismode-darwin-x64 crisismode-darwin-arm64; do
            shasum -a 256 "$bin" > "${bin}.sha256"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-darwin
          path: |
            dist/crisismode-darwin-x64
            dist/crisismode-darwin-x64.sha256
            dist/crisismode-darwin-arm64
            dist/crisismode-darwin-arm64.sha256

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  release:
    needs: [build-linux, build-darwin]
    runs-on: ubuntu-latest
    # The only job that publishes anything.
    permissions:
      contents: write
    steps:
      # fetch-depth: 0 for the tag history the release notes are diffed against.
      # At the default depth of 1 no tags are fetched, so the previous-tag
      # lookup below silently produced an empty string.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate version matches package.json
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)" >&2
            exit 1
          fi

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-linux
          path: release

      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-darwin
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag immediately preceding the one being released. `sed -n 2p`
          # assumed the released tag always sorts first — it does not when an
          # older version is re-tagged, and it could select the tag itself.
          #
          # Two different reasons for an empty result, which must not be
          # conflated: the released tag is the oldest one (a genuine first
          # release, so notes should span the full history), versus the tag not
          # being in the list at all (unexpected — fall back to the newest).
          if git tag --list "$GITHUB_REF_NAME" | grep -q .; then
            PREV_TAG=$(git tag --sort=-v:refname \
              | awk -v cur="$GITHUB_REF_NAME" '$0 == cur { found = 1; next } found { print; exit }')
          else
            echo "warning: ${GITHUB_REF_NAME} not found in the tag list" >&2
            PREV_TAG=$(git tag --sort=-v:refname | head -n1 || true)
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "Generating notes since ${PREV_TAG}"
            gh release create "$GITHUB_REF_NAME" \
              --title "CrisisMode $GITHUB_REF_NAME" \
              --generate-notes \
              --notes-start-tag "$PREV_TAG" \
              release/*
          else
            echo "No prior tag found — generating notes from the full history"
            gh release create "$GITHUB_REF_NAME" \
              --title "CrisisMode $GITHUB_REF_NAME" \
              --generate-notes \
              release/*
          fi

          # Prepend install instructions to the generated notes
          EXISTING_NOTES=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)
          printf '%s\n' '## Install' '' '**Linux:**' '```bash' \
            'curl -fsSL https://github.com/trs-80/crisismode/releases/latest/download/crisismode-linux-x64 -o crisismode' \
            'chmod +x crisismode' './crisismode scan' '```' '' \
            '**macOS:**' '```bash' \
            'curl -fsSL https://github.com/trs-80/crisismode/releases/latest/download/crisismode-darwin-arm64 -o crisismode' \
            'chmod +x crisismode' './crisismode scan' '```' '' '---' > /tmp/release-notes.md
          printf '%s' "$EXISTING_NOTES" >> /tmp/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md
